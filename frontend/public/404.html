<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030711" />
    <title>Page not found · Pagină inexistentă — Weather Simulation</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at center, #0b1530 0%, #030711 70%);
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .orb {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #7dd3fc, #1d4ed8 55%, #0b1530 100%);
        box-shadow: 0 0 40px rgba(56, 189, 248, 0.45);
      }
      h1 { margin: 0 0 8px; font-size: 1.5rem; color: #fff; }
      p { margin: 0 0 22px; color: #94a3b8; }
      .alt { margin-top: -10px; font-size: 0.92rem; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 999px;
        background: #1d4ed8;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>This page drifted off the map</h1>
      <p>There is nothing at this address. The live globe is one click away.</p>
      <p class="alt" lang="ro">Pagina asta a ieșit de pe hartă: la adresa aceasta nu e nimic. Globul live e la un clic distanță.</p>
      <div class="actions">
        <a href="/">Back to the simulation</a>
        <a href="/" lang="ro">Înapoi la simulare</a>
      </div>
    </main>
  </body>
</html>
