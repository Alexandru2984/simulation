# Per-IP limits sized for a classroom or office behind one NAT address (about
# 30 people loading at once); the backend also enforces global budgets on
# mutations and a viewer cap (SIM_WS_MAX_CLIENTS).
limit_req_zone  $binary_remote_addr zone=sim_inject:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=sim_api:10m rate=30r/m;
limit_req_zone  $binary_remote_addr zone=sim_ws_req:10m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=sim_report:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=sim_ws_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name simulation.micutu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name simulation.micutu.com;

    root /srv/canary/simulation.micutu.com/project/frontend/dist;
    index index.html;
    access_log /var/log/nginx/simulation-canary.access.log;
    error_log /var/log/nginx/simulation-canary.error.log warn;
    server_tokens off;
    client_max_body_size 64k;

    set $simulation_origin_allowed $from_cloudflare_origin;
    if ($simulation_origin_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/simulation.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simulation.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:simulation_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Rate-limited clients get a retryable status instead of 503, in the same
    # JSON error contract as the backend.
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 @rate_limited;

    # The global config only compresses text/html.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/xml application/javascript
               text/javascript application/json application/manifest+json image/svg+xml;

    # The app keeps its state in the URL hash, so "/" is the only page.
    # Everything else is a real file or a real 404 (no soft-404s for crawlers).
    error_page 404 /404.html;

    include /etc/nginx/snippets/simulation-security-headers.conf;

    location = /api/healthz {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/readyz {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every API and stream route is lower-case, but Drogon matches paths
    # case-insensitively: /api/METRICS or /api/Grid/Inject would slip past the
    # case-sensitive locations below and their stricter limits. Regex
    # locations match in order, so this one goes first.
    location ~ ^/(api|ws)/.*[A-Z] {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Build SHA, build time, uptime and the client error summary are for
    # operators only. Local tools (scripts/deploy.sh, scripts/export-metrics.sh)
    # query 127.0.0.1:8094; the backend also refuses proxied requests to them.
    location ~ ^/api/(metrics|version|ops/.*)$ {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }

    # Browser error reports: small, rare, and kept out of the API budget so
    # a crash loop cannot starve the app's own requests.
    location = /api/client-errors {
        limit_req zone=sim_report burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/grid/inject {
        limit_req zone=sim_inject burst=5 nodelay;
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=sim_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        limit_req zone=sim_ws_req burst=30 nodelay;
        limit_conn sim_ws_conn 40;
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # add_header in a location replaces the server-level headers, so every
    # location below re-includes the security headers.

    # App shell: always revalidate so a deploy is picked up immediately.
    location = / {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The privacy notice, at a clean address.
    location = /privacy {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /privacy.html =404;
    }

    location = /privacy.html {
        return 301 /privacy;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed bundles never change.
    location /assets/ {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Unhashed media: a week, refreshed in the background.
    location ~ ^/(textures|icons)/ {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.svg|apple-touch-icon\.png|og-image\.jpg)$ {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        access_log off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Security contact (RFC 9116); must be text/plain in UTF-8.
    location = /.well-known/security.txt {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location @rate_limited {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 429 '{"error":"rate_limited"}';
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/simulation-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
