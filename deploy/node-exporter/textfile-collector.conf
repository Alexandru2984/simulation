# Drop-in for the host's node_exporter.service: enable the textfile collector
# so weather_backend.prom (and the packaged apt/nvme/smartmon collectors)
# reach Prometheus. Install to:
#   /etc/systemd/system/node_exporter.service.d/textfile-collector.conf
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter --collector.textfile.directory=/var/lib/prometheus/node-exporter
